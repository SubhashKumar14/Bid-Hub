<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid·Hub — Independent Student Work Exchange</title>
    <meta name="description" content="An independent student work exchange: editorial project briefs, precise project directories, and reliable escrow-protected milestones." />
    <meta name="keywords" content="student freelance, student work exchange, college bidding, student projects, escrow protection" />
    <meta property="og:title" content="Bid·Hub — Independent Student Work Exchange" />
    <meta property="og:description" content="Good work shouldn't wait for graduation. Connect real projects with student talent through clear briefs and transparent escrow." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/bidhub/social/bidhub-social-light-1200.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/bidhub/social/bidhub-social-light-1200.png" />
    <meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)" />
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/bidhub/app/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/bidhub/app/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/bidhub/app/apple-touch-icon-180.png" />
    <link rel="manifest" href="/brand/bidhub/app/site.webmanifest" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bidhub-theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#1A1917';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F5F3EE';
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.jsx"></script>
  </body>
</html>
