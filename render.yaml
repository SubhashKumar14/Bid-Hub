services:
  - type: web
    name: bidhub-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 1d
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PRODUCT_MODE
        value: demo
      - key: PRIVATE_STORAGE
        value: mongodb
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: bidhub
      - key: MAX_PROJECT_FILES
        value: "20"
      - key: MAX_PROJECT_SIZE_MB
        value: "50"
