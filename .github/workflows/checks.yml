name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix backend
      - run: npm run test:security --prefix backend
      - run: npm run test:frontend
      - run: npm run build
